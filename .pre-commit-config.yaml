fail_fast: true
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff-format
        name: "Ruff formatter"
        args: [--config=pyproject.toml]
        files: '^(doclang|tests|utils).*\.py$'
      - id: ruff
        name: "Ruff linter"
        args: [--exit-non-zero-on-fix, --fix, --config=pyproject.toml]
        files: '^(doclang|tests|utils).*\.py$'
  - repo: local
    hooks:
      - id: mypy
        name: MyPy
        entry: uv run --no-sync mypy doclang tests
        pass_filenames: false
        language: system
        files: '\.py$'
  - repo: local
    hooks:
      - id: pytest
        name: Pytest
        entry: uv run --no-sync pytest
        pass_filenames: false
        language: system
        files: '\.py$'
  - repo: local
    hooks:
      - id: reference-sync-check
        name: reference-sync-check
        entry: uv run --no-sync python utils/generate_reference.py --check reference/input
        pass_filenames: false
        language: system
        files: '^(spec\.md|reference/input/.*|utils/generate_reference\.py)$'
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.8
    hooks:
      - id: uv-lock
