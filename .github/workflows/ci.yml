name: Run CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - "**"
      - "!gh-pages"

jobs:
  code-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: pre-commit cache key
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install dependencies
        run: uv sync --frozen --no-default-groups --group ci
      - name: Check style and run tests
        run: pre-commit run --all-files

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev ninja-build
      - name: Configure native tests
        run: cmake -S . -B build/native-tests -G Ninja -DDOCLANG_BUILD_PYTHON=OFF -DDOCLANG_BUILD_CPP_TESTS=ON -DDOCLANG_BUILD_VALIDATION_TESTS=ON
      - name: Build native tests
        run: cmake --build build/native-tests --parallel
      - name: Run core native tests
        run: ctest --test-dir build/native-tests -L core --output-on-failure
      - name: Run native validation tests
        run: ctest --test-dir build/native-tests -L validation --output-on-failure
